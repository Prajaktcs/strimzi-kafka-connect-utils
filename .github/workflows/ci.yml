name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI only needs repository read access; leave all other token permissions disabled.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev \
            libcurl4-openssl-dev libsasl2-dev libzstd-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Test core without Kafka
        run: cargo test -p strimzi-ops-core --no-default-features

      - name: Lint example connectors
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in examples/*.{yaml,yml,json}; do
            echo "Linting $file..."
            cargo run -q -p strimzi-ops --bin strimzi-lint -- lint "$file"
          done

      - name: Build release checkpoint
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --release --workspace --all-features

      - name: Upload release checkpoint binaries
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: strimzi-ops-linux-x86_64-${{ github.sha }}
          path: |
            target/release/strimzi-ops
            target/release/strimzi-lint
            target/release/strimzi-ui
          if-no-files-found: error
          retention-days: 14
