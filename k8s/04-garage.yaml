apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: kafka
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage:3901"
    rpc_secret = "5c52402170364952097441656c3821034c442340356536565c40445d4444535d"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.local"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.local"
    index = "index.html"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: kafka
spec:
  serviceName: "garage"
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3901
              name: rpc
            - containerPort: 3902
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: data
              mountPath: /var/lib/garage
          env:
            - name: RUST_LOG
              value: info
            # Fixed local-dev credentials (not for production)
            - name: GARAGE_DEFAULT_ACCESS_KEY
              value: "GKaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            - name: GARAGE_DEFAULT_SECRET_KEY
              value: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
            - name: GARAGE_DEFAULT_BUCKET
              value: "warehouse"
          readinessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: kafka
spec:
  ports:
    - port: 3900
      name: s3
      targetPort: 3900
    - port: 3901
      name: rpc
      targetPort: 3901
    - port: 3902
      name: web
      targetPort: 3902
  selector:
    app: garage
