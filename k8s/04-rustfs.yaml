# Fixed credentials for local development only; never use these in production.
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-s3-credentials
  namespace: kafka
type: Opaque
stringData:
  accessKeyId: rustfsadmin
  secretKey: rustfsadmin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: kafka
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-s3-credentials
                  key: accessKeyId
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-s3-credentials
                  key: secretKey
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_REGION
              value: us-east-1
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: kafka
spec:
  ports:
    - port: 9000
      name: s3
      targetPort: s3
    - port: 9001
      name: console
      targetPort: console
  selector:
    app: rustfs
