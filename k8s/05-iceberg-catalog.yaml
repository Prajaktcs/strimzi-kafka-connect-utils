apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  namespace: kafka
  labels:
    app: nessie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nessie
  template:
    metadata:
      labels:
        app: nessie
    spec:
      containers:
        - name: nessie
          image: ghcr.io/projectnessie/nessie:0.108.4
          ports:
            - containerPort: 19120
              name: http
          env:
            - name: QUARKUS_HTTP_PORT
              value: "19120"
            - name: NESSIE_VERSION_STORE_TYPE
              value: "ROCKSDB"
            - name: NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH
              value: "/var/lib/nessie/data"
            - name: JAVA_OPTS_APPEND
              value: >-
                -Dnessie.catalog.default-warehouse=warehouse
                -Dnessie.catalog.warehouses.warehouse.location=s3://warehouse/iceberg
                -Dnessie.catalog.service.s3.default-options.endpoint=http://garage:3900
                -Dnessie.catalog.service.s3.default-options.path-style-access=true
                -Dnessie.catalog.service.s3.default-options.region=garage
                -Dnessie.catalog.service.s3.default-options.auth-type=APPLICATION_GLOBAL
                -Dnessie.catalog.service.s3.default-options.chunked-encoding-enabled=false
            # Fixed local-dev credentials, matching Garage (not for production).
            - name: AWS_ACCESS_KEY_ID
              value: "GKaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            - name: AWS_SECRET_ACCESS_KEY
              value: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          volumeMounts:
            - name: nessie-data
              mountPath: /var/lib/nessie/data
      volumes:
        - name: nessie-data
          persistentVolumeClaim:
            claimName: nessie-data
---
apiVersion: v1
kind: Service
metadata:
  name: nessie
  namespace: kafka
spec:
  ports:
    - port: 19120
      name: http
      targetPort: 19120
  selector:
    app: nessie
---
# We need a PersistentVolumeClaim for Nessie's RocksDB if we want it to survive pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nessie-data
  namespace: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
